[package]
name = "gugumanager-extension-runner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.93"

[dependencies]
anyhow = "=1.0.99"
cap-std = "=3.4.4"
prost = "=0.14.1"
sha2 = "=0.10.9"
ureq = { version = "=3.1.0", default-features = false, features = ["rustls"] }
url = "=2.5.4"
wasmtime = { version = "=48.0.0", features = ["component-model"] }

[build-dependencies]
prost-build = "=0.14.1"
protoc-bin-vendored = "=3.2.0"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
