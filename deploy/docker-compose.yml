name: gugumanager-dev

services:
  control-plane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      GUGU_ENVIRONMENT: development
      GUGU_HTTP_ADDR: 0.0.0.0:8080
      GUGU_WEB_ROOT: /app/web
      GUGU_DEV_ADMIN_EMAIL: ${GUGU_DEV_ADMIN_EMAIL:-admin@gugu.local}
      GUGU_DEV_ADMIN_PASSWORD: ${GUGU_DEV_ADMIN_PASSWORD:-gugu-dev-2026}
      GUGU_DEV_AGENT_TOKEN: ${GUGU_DEV_AGENT_TOKEN:-gugu-agent-dev-token}
      GUGU_DEV_DATA_ROOT: /var/lib/gugumanager/servers
      # Agent mTLS gRPC 网关仅在 GUGU_ENVIRONMENT=production 时启动；
      # 此处预留监听地址与端口，切换为 production 后 agent 服务即可注册。
      GUGU_AGENT_GRPC_ADDR: 0.0.0.0:8443
    ports:
      - "127.0.0.1:${GUGU_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${GUGU_AGENT_GRPC_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - server-data:/var/lib/gugumanager/servers
    restart: unless-stopped

  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # 镜像 ENTRYPOINT 默认运行 control-plane，agent 服务显式覆盖入口。
    entrypoint: ["/usr/local/bin/gugu-agent"]
    environment:
      GUGU_AGENT_PANEL_ADDR: control-plane:8443
      GUGU_AGENT_REGISTRATION_TOKEN: ${GUGU_DEV_AGENT_TOKEN:-gugu-agent-dev-token}
      GUGU_AGENT_NODE_NAME: ${GUGU_AGENT_NODE_NAME:-dev-node-01}
      GUGU_AGENT_VERSION: 0.1.0-dev
      GUGU_AGENT_DATA_ROOT: /var/lib/gugumanager/servers
      GUGU_AGENT_CERT_DIR: /var/lib/gugumanager/agent/certs
    volumes:
      # 挂载宿主 Docker socket，agent 通过 Docker Engine API 创建/管理游戏服务器容器。
      - /var/run/docker.sock:/var/run/docker.sock
      # 服务器数据与 agent 证书（agent.crt/agent.key/node-id/ca.crt）持久化。
      - agent-data:/var/lib/gugumanager
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gugumanager}
      POSTGRES_USER: ${POSTGRES_USER:-gugumanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gugumanager-dev-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../migrations/000001_core.up.sql:/docker-entrypoint-initdb.d/000001_core.sql:ro
      - ../migrations/000002_identity.up.sql:/docker-entrypoint-initdb.d/000002_identity.sql:ro
      - ../migrations/000003_membership_permissions.up.sql:/docker-entrypoint-initdb.d/000003_membership_permissions.sql:ro
      - ../migrations/000004_password_reset.up.sql:/docker-entrypoint-initdb.d/000004_password_reset.sql:ro
      - ../migrations/000005_controlplane_stage1.up.sql:/docker-entrypoint-initdb.d/000005_controlplane_stage1.sql:ro
      - ../migrations/000006_telemetry_persistence.up.sql:/docker-entrypoint-initdb.d/000006_telemetry_persistence.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  server-data:
  agent-data:
  postgres-data:
  redis-data:
