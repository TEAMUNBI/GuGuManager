name: gugumanager-dev

services:
  control-plane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      GUGU_ENVIRONMENT: development
      GUGU_HTTP_ADDR: 0.0.0.0:8080
      GUGU_WEB_ROOT: /app/web
      GUGU_DEV_ADMIN_EMAIL: ${GUGU_DEV_ADMIN_EMAIL:-admin@gugu.local}
      GUGU_DEV_ADMIN_PASSWORD: ${GUGU_DEV_ADMIN_PASSWORD:-gugu-dev-2026}
      GUGU_DEV_AGENT_TOKEN: ${GUGU_DEV_AGENT_TOKEN:-gugu-agent-dev-token}
      GUGU_DEV_DATA_ROOT: /var/lib/gugumanager/servers
    ports:
      - "127.0.0.1:${GUGU_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - server-data:/var/lib/gugumanager/servers
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gugumanager}
      POSTGRES_USER: ${POSTGRES_USER:-gugumanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gugumanager-dev-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../migrations/000001_core.up.sql:/docker-entrypoint-initdb.d/000001_core.sql:ro
      - ../migrations/000002_identity.up.sql:/docker-entrypoint-initdb.d/000002_identity.sql:ro
      - ../migrations/000003_membership_permissions.up.sql:/docker-entrypoint-initdb.d/000003_membership_permissions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  server-data:
  postgres-data:
  redis-data:
