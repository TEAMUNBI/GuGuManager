name: gugumanager-prod

# 生产模式示例：Control Plane（Postgres 持久化 + mTLS Agent 网关）+ Agent + Postgres + Redis。
# 使用前：
#   1. 复制 deploy/.env.example 为 deploy/.env 并替换所有占位值（GUGU_PUBLIC_URL、POSTGRES_PASSWORD 等）。
#   2. 生成 secret 文件（参考 deploy/.env.example 中的说明）放入 deploy/secrets/：
#        encryption.key / agent-ca.crt / agent-ca.key / bootstrap-token
#   3. TLS 由前置反向代理（Nginx/Caddy/Traefik）终止，HTTP 与 gRPC 端口默认只绑定本机回环。
#   4. agent 容器内的 gugu 用户（uid 10001）需要宿主 Docker socket 的读权限：
#      可将 10001 加入宿主机 docker 组，或改用 docker-socket-proxy 等代理方案。

services:
  control-plane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      GUGU_ENVIRONMENT: production
      GUGU_HTTP_ADDR: 0.0.0.0:8080
      GUGU_WEB_ROOT: /app/web
      # 必填：面板对外公开的 HTTPS 地址（反向代理在此终止 TLS）。
      GUGU_PUBLIC_URL: ${GUGU_PUBLIC_URL:-https://panel.example.com}
      GUGU_DATABASE_URL: postgres://${POSTGRES_USER:-gugumanager}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gugumanager}
      GUGU_REDIS_URL: redis://redis:6379/0
      # 生产要求全部 secret 以文件形式挂载（必须是可读的非空文件）。
      GUGU_ENCRYPTION_KEY_FILE: /run/secrets/encryption-key
      GUGU_AGENT_CA_CERT_FILE: /run/secrets/agent-ca-cert
      GUGU_AGENT_CA_KEY_FILE: /run/secrets/agent-ca-key
      GUGU_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap-token
      # 生产必须显式声明 TLS 由外部终止（否则校验失败）。
      GUGU_TLS_TERMINATED: "true"
      # Agent 注册令牌：留空时回退使用 bootstrap token。
      GUGU_AGENT_REGISTRATION_TOKEN: ${GUGU_AGENT_REGISTRATION_TOKEN:-}
      # Agent HTTP 心跳令牌：留空时与 bootstrap token 一致。
      GUGU_AGENT_TOKEN: ${GUGU_AGENT_TOKEN:-}
      GUGU_AGENT_GRPC_ADDR: 0.0.0.0:8443
      # 部署在 NAT/端口转发后时补充公网 IP（证书 SAN），逗号分隔。
      GUGU_AGENT_GRPC_PUBLIC_IPS: ${GUGU_AGENT_GRPC_PUBLIC_IPS:-}
      # 生产由容器内迁移器执行 migration；镜像不含源码 migrations 目录，需挂载。
      GUGU_MIGRATIONS_DIR: /app/migrations
      GUGU_FILE_ROOT: /var/lib/gugumanager/servers
      GUGU_LOG_LEVEL: ${GUGU_LOG_LEVEL:-info}
      GUGU_LOG_FORMAT: ${GUGU_LOG_FORMAT:-json}
    ports:
      - "127.0.0.1:${GUGU_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${GUGU_AGENT_GRPC_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - server-data:/var/lib/gugumanager/servers
      - ../migrations:/app/migrations:ro
    secrets:
      - encryption-key
      - agent-ca-cert
      - agent-ca-key
      - bootstrap-token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # 镜像 ENTRYPOINT 默认运行 control-plane，agent 服务显式覆盖入口。
    entrypoint: ["/usr/local/bin/gugu-agent"]
    environment:
      GUGU_AGENT_PANEL_ADDR: control-plane:8443
      # 必须与 control-plane 的 GUGU_AGENT_REGISTRATION_TOKEN（或 bootstrap token）一致。
      GUGU_AGENT_REGISTRATION_TOKEN: ${GUGU_AGENT_REGISTRATION_TOKEN:-}
      GUGU_AGENT_NODE_NAME: ${GUGU_AGENT_NODE_NAME:-prod-node-01}
      GUGU_AGENT_VERSION: ${GUGU_AGENT_VERSION:-0.1.0-dev}
      GUGU_AGENT_DATA_ROOT: /var/lib/gugumanager/servers
      GUGU_AGENT_CERT_DIR: /var/lib/gugumanager/agent/certs
    volumes:
      # 挂载宿主 Docker socket，agent 通过 Docker Engine API 创建/管理游戏服务器容器。
      - /var/run/docker.sock:/var/run/docker.sock
      # 服务器数据与 agent 证书（agent.crt/agent.key/node-id/ca.crt）持久化。
      - agent-data:/var/lib/gugumanager
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gugumanager}
      POSTGRES_USER: ${POSTGRES_USER:-gugumanager}
      # 必填：替换为高强度密码（secret 文件中另有 DATABASE_URL 对应密码时保持一致）。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

# 挂载到各服务的 /run/secrets/<secret-name>，文件需手动放入 deploy/secrets/。
secrets:
  encryption-key:
    file: ./secrets/encryption.key
  agent-ca-cert:
    file: ./secrets/agent-ca.crt
  agent-ca-key:
    file: ./secrets/agent-ca.key
  bootstrap-token:
    file: ./secrets/bootstrap-token

volumes:
  server-data:
  agent-data:
  postgres-data:
  redis-data:
