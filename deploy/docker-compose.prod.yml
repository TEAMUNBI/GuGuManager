name: gugumanager-prod

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gugumanager}
      POSTGRES_USER: ${POSTGRES_USER:-gugumanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  control-plane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      GUGU_ENVIRONMENT: production
      GUGU_HTTP_ADDR: 0.0.0.0:8080
      GUGU_WEB_ROOT: /app/web
      GUGU_PUBLIC_URL: ${GUGU_PUBLIC_URL:-https://panel.example.com}
      GUGU_DATABASE_URL: postgres://${POSTGRES_USER:-gugumanager}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gugumanager}?sslmode=disable
      GUGU_REDIS_URL: redis://redis:6379/0
      GUGU_ENCRYPTION_KEY_FILE: /run/secrets/encryption-key
      GUGU_AGENT_CA_CERT_FILE: /run/secrets/ca.crt
      GUGU_AGENT_CA_KEY_FILE: /run/secrets/ca.key
      GUGU_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap-token
      GUGU_TLS_TERMINATED: "true"
      GUGU_AGENT_REGISTRATION_TOKEN: ${GUGU_AGENT_REGISTRATION_TOKEN:-}
      GUGU_AGENT_TOKEN: ${GUGU_AGENT_TOKEN:-}
      GUGU_AGENT_GRPC_ADDR: 0.0.0.0:8443
      GUGU_AGENT_GRPC_PUBLIC_IPS: ${GUGU_AGENT_GRPC_PUBLIC_IPS:-}
      GUGU_MIGRATIONS_DIR: /app/migrations
      GUGU_FILE_ROOT: /var/lib/gugumanager/servers
      GUGU_LOG_LEVEL: ${GUGU_LOG_LEVEL:-info}
      GUGU_LOG_FORMAT: ${GUGU_LOG_FORMAT:-json}
    ports:
      - "127.0.0.1:${GUGU_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${GUGU_AGENT_GRPC_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    volumes:
      - control-plane-data:/var/lib/gugumanager
    secrets:
      - source: encryption-key
        target: encryption-key
      - source: agent-ca-cert
        target: ca.crt
      - source: agent-ca-key
        target: ca.key
      - source: bootstrap-token
        target: bootstrap-token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bundle-publisher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/usr/local/bin/gamectl"]
    command: ["bundle", "publish", "/app/bundles/papermc-1.21.8.json"]
    environment:
      GUGU_DATABASE_URL: postgres://${POSTGRES_USER:-gugumanager}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gugumanager}?sslmode=disable
    depends_on:
      control-plane:
        condition: service_healthy
    restart: "no"

  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export GUGU_AGENT_REGISTRATION_TOKEN="$$(cat /run/secrets/bootstrap-token)"
        exec /usr/local/bin/gugu-agent
    environment:
      GUGU_AGENT_PANEL_ADDR: control-plane:8443
      GUGU_AGENT_NODE_NAME: ${GUGU_AGENT_NODE_NAME:-prod-node-01}
      GUGU_AGENT_VERSION: ${GUGU_AGENT_VERSION:-0.1.0-dev}
      GUGU_AGENT_DATA_ROOT: /var/lib/gugumanager/servers
      GUGU_AGENT_CERT_DIR: /var/lib/gugumanager/agent/certs
      GUGU_AGENT_TRUST_ROOT: /run/secrets/ca.crt
      GUGU_AGENT_CA_FINGERPRINT: ${GUGU_AGENT_CA_FINGERPRINT:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-data:/var/lib/gugumanager
    secrets:
      - source: agent-ca-cert
        target: ca.crt
      - source: bootstrap-token
        target: bootstrap-token
    depends_on:
      bundle-publisher:
        condition: service_completed_successfully
    restart: unless-stopped

secrets:
  encryption-key:
    file: ./secrets/encryption.key
  agent-ca-cert:
    file: ./secrets/agent-ca.crt
  agent-ca-key:
    file: ./secrets/agent-ca.key
  bootstrap-token:
    file: ./secrets/bootstrap-token

volumes:
  control-plane-data:
  agent-data:
  postgres-data:
  redis-data:
