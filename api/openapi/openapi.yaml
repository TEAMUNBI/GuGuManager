      properties:
        decision: {type: string, enum: [approved, rejected, revoked]}
        reason: {type: string, maxLength: 2000, default: ''}
    BundleReview:
      type: object
      additionalProperties: false
      required: [id, bundleId, decision, reason, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        bundleId: {$ref: '#/components/schemas/Uuid'}
        reviewerId: {$ref: '#/components/schemas/Uuid'}
        decision: {type: string, enum: [approved, rejected, revoked]}
        reason: {type: string, maxLength: 2000}
        createdAt: {type: string, format: date-time}
    BundleReviewResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/BundleReview'}
    Schedule:
      type: object
      additionalProperties: false
      required: [id, name, action, cronExpression, timezone, enabled, missedRunPolicy, concurrencyPolicy, nextRunAt, lastScheduledAt, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        serverId: {$ref: '#/components/schemas/Uuid'}
        name: {type: string, minLength: 1, maxLength: 128}
        action: {type: string, enum: [backup, start, stop, restart, retention-cleanup]}
        cronExpression: {type: string, minLength: 1}
        timezone: {type: string, minLength: 1, description: IANA timezone identifier.}
        enabled: {type: boolean}
        missedRunPolicy: {type: string, enum: [skip, run-once, catch-up]}
        concurrencyPolicy: {type: string, enum: [forbid, allow, replace]}
        nextRunAt: {type: [string, 'null'], format: date-time}
        lastScheduledAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ScheduleRequest:
      type: object
      additionalProperties: false
      required: [name, action, cronExpression]
      properties:
        serverId: {$ref: '#/components/schemas/Uuid'}
        name: {type: string, minLength: 1, maxLength: 128}
        action: {type: string, enum: [backup, start, stop, restart, retention-cleanup]}
        cronExpression: {type: string, minLength: 1}
        timezone: {type: string, default: UTC}
        enabled: {type: boolean, default: true}
        missedRunPolicy: {type: string, enum: [skip, run-once, catch-up], default: skip}
        concurrencyPolicy: {type: string, enum: [forbid, allow, replace], default: forbid}
    ScheduleResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Schedule'}
    ScheduleListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Schedule'}
    ScheduleRun:
