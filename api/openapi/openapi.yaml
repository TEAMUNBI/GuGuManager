          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookTestResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /quota:
    get:
      tags: [Capacity]
      operationId: getQuota
      summary: Read workspace quota limits
      responses:
        '200':
          description: Workspace quota
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuotaResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    put:
      tags: [Capacity]
      operationId: putQuota
      summary: Replace workspace quota limits
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuotaRequest'}
      responses:
        '200':
          description: Updated workspace quota
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuotaResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /capacity:
    get:
      tags: [Capacity]
      operationId: getCapacity
      summary: Read aggregate fleet usage and limits
      responses:
        '200':
          description: Fleet capacity snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapacityResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /outbox/dead-letters:
    get:
      tags: [Outbox]
      operationId: listOutboxDeadLetters
      summary: List transactional events whose publish retries were exhausted
      responses:
        '200':
          description: Outbox dead letters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OutboxDeadLetterListResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /outbox/dead-letters/{eventId}/replay:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Uuid'}
    post:
      tags: [Outbox]
      operationId: replayOutboxDeadLetter
      summary: Reset a dead letter for normal publisher retry
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': {description: Event returned to the publish queue}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /operations:
    get:
      tags: [Servers]
      operationId: listOperations
      summary: List operations visible through current server read grants
      parameters:
        - name: cursor
          in: query
          schema: {type: string, minLength: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: Operations ordered by immutable creation time and ID
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationListResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /operations/{operationId}:
    get:
      tags: [Servers]
      operationId: getOperation
      summary: Read an operation
      parameters:
        - name: operationId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Uuid'}
      responses:
        '200':
          description: Operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: List audit events
      responses:
        '200':
          description: Append-only audit events
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEvent'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gugu_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    ServerId:
      name: serverId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    UserId:
      name: userId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    NodeId:
      name: nodeId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    BackupId:
      name: backupId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    AllocationId:
      name: allocationId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128, pattern: '^[\x20-\x7E]+$'}
    IfMatchGeneration:
      name: If-Match
      in: header
      required: true
      description: Numeric server generation read before submitting the mutation.
      schema: {type: integer, minimum: 1}
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 32, maxLength: 256}
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RateLimited:
      description: Login attempts are temporarily blocked for an account or source IP
      headers:
        Retry-After:
          required: true
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    Uuid:
      type: string
      format: uuid
    SetupStatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [required]
          properties:
            required: {type: boolean}
            bootstrapExpiresAt: {type: string, format: date-time}
    SetupAdminRequest:
      type: object
      additionalProperties: false
      required: [bootstrapToken, email, displayName, password]
      properties:
        bootstrapToken: {type: string, minLength: 32, maxLength: 256}
        email: {type: string, format: email, maxLength: 254}
        displayName: {type: string, minLength: 1, maxLength: 64}
        password: {type: string, minLength: 8, maxLength: 1024}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 8, maxLength: 1024}
    User:
      type: object
      additionalProperties: false
      required: [id, email, displayName, roles, status, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        email: {type: string, format: email}
        displayName: {type: string, minLength: 1, maxLength: 64}
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string}
        status: {type: string, enum: [active, disabled]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    UserResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/User'}
    UserListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/User'}
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, displayName, password, roles]
      properties:
        email: {type: string, format: email, maxLength: 254}
        displayName: {type: string, minLength: 1, maxLength: 64}
        password: {type: string, minLength: 8, maxLength: 1024}
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [platform_admin, server_owner]}
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: {type: string, minLength: 1, maxLength: 64}
        status: {type: string, enum: [active, disabled]}
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [platform_admin, server_owner]}
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: {type: string, minLength: 32, maxLength: 256}
        password: {type: string, minLength: 8, maxLength: 1024}
    PasswordResetToken:
      type: object
      additionalProperties: false
      required: [token, expiresAt]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
          description: Plaintext is returned exactly once; persistence retains only a SHA-256 digest.
        expiresAt: {type: string, format: date-time}
    PasswordResetTokenResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/PasswordResetToken'}
    APITokenScope:
      type: string
      enum: [platform.admin, audit.read, nodes.manage, catalog.manage, automation.manage, notifications.manage, storage.manage, quotas.manage, servers.read, servers.power, servers.console, servers.files.read, servers.files.write, servers.backups.read, servers.backups.create, servers.backups.restore, servers.backups.delete, servers.network.read, servers.network.write, servers.startup.read, servers.startup.write]
    APIToken:
      type: object
      additionalProperties: false
      required: [id, name, scopes, expiresAt, lastUsedAt, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string, minLength: 1, maxLength: 64}
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/APITokenScope'}
        expiresAt: {type: [string, 'null'], format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    CreateAPITokenRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/APITokenScope'}
        expiresAt: {type: string, format: date-time}
    APITokenListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/APIToken'}
    APITokenCredentialResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/APIToken'
            - type: object
              required: [token]
              properties:
                token: {type: string, minLength: 32, maxLength: 256}
    ConsoleConnectionCredentialResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [token, expiresAt]
          properties:
            token: {type: string, minLength: 32, maxLength: 256}
            expiresAt: {type: string, format: date-time}
    ServerPermission:
      type: string
      enum:
        - servers.read
        - servers.power
        - servers.console
        - servers.files.read
        - servers.files.write
        - servers.backups.read
        - servers.backups.create
        - servers.backups.restore
        - servers.backups.delete
        - servers.network.read
        - servers.network.write
        - servers.startup.read
        - servers.startup.write
    PutServerMembershipRequest:
      type: object
      additionalProperties: false
      required: [permissions]
      properties:
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          contains: {const: servers.read}
          items: {$ref: '#/components/schemas/ServerPermission'}
    ServerMembership:
      type: object
      additionalProperties: false
      required: [serverId, userId, permissions, createdAt, updatedAt]
      properties:
        serverId: {$ref: '#/components/schemas/Uuid'}
        userId: {$ref: '#/components/schemas/Uuid'}
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          contains: {const: servers.read}
          items: {$ref: '#/components/schemas/ServerPermission'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ServerMembershipResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/ServerMembership'}
    ServerPermissions:
      type: object
      additionalProperties: false
      required: [serverId, permissions]
      properties:
        serverId: {$ref: '#/components/schemas/Uuid'}
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          contains: {const: servers.read}
          items: {$ref: '#/components/schemas/ServerPermission'}
    ServerPermissionsResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/ServerPermissions'}
    SessionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, csrfToken, environment]
          properties:
            user: {$ref: '#/components/schemas/User'}
            csrfToken: {type: string}
            environment: {type: string, enum: [development, production]}
    ResourceMetrics:
      type: object
      required: [cpuPercent, memoryBytes, memoryLimitBytes, diskBytes, diskLimitBytes]
      properties:
        cpuPercent: {type: number, minimum: 0}
        memoryBytes: {type: integer, minimum: 0}
        memoryLimitBytes: {type: integer, minimum: 0}
        diskBytes: {type: integer, minimum: 0}
        diskLimitBytes: {type: integer, minimum: 0}
        networkRxBytes: {type: integer, minimum: 0}
        networkTxBytes: {type: integer, minimum: 0}
        playersOnline: {type: integer, minimum: 0}
        playersMax: {type: integer, minimum: 0}
    MetricPoint:
      type: object
      required: [timestamp, cpuPercent, memoryBytes]
      properties:
        timestamp: {type: string, format: date-time}
        cpuPercent: {type: number, minimum: 0}
        memoryBytes: {type: integer, minimum: 0}
    Server:
      type: object
      required: [id, name, description, gameId, gameBundleDigest, gameDefinitionVersion, gameName, gameVersion, nodeId, nodeName, lifecycleState, desiredPower, observedPower, nodeCondition, healthCondition, generation, observedGeneration, observedAt, allocation, ownerName, metrics, metricHistory, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        description: {type: string}
        gameId: {type: string}
        gameBundleDigest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: Immutable sha256 identity of the published Bundle; it is not the game release version or a component image digest.
        gameDefinitionVersion:
          type: string
          description: SemVer of the immutable GameDefinition selected at creation time.
        gameName: {type: string}
        gameVersion:
          type: string
          description: Opaque upstream game release identifier resolved from spec.release.version.
        nodeId: {$ref: '#/components/schemas/Uuid'}
        nodeName: {type: string}
        lifecycleState: {type: string, enum: [provisioning, ready, deleting, deleted]}
        desiredPower: {type: string, enum: [running, stopped]}
        observedPower: {type: string, enum: [unknown, stopped, starting, running, stopping]}
        nodeCondition: {type: string, enum: [available, offline, maintenance]}
        healthCondition: {type: string, enum: [unknown, healthy, unhealthy]}
        generation: {type: integer, minimum: 1}
        observedGeneration: {type: integer, minimum: 0}
        observedAt: {type: string, format: date-time}
        allocation: {type: string}
        ownerName: {type: string}
        metrics: {$ref: '#/components/schemas/ResourceMetrics'}
        metricHistory:
          type: array
          items: {$ref: '#/components/schemas/MetricPoint'}
        updatedAt: {type: string, format: date-time}
    ServerListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Server'}
        page:
          type: object
          required: [nextCursor]
          properties:
            nextCursor: {type: [string, 'null']}
    CreateServerRequest:
      type: object
      additionalProperties: false
      required: [name, gameDefinitionId, gameBundleDigest, nodeId, memoryMb, diskGb]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        gameDefinitionId: {type: string}
        gameBundleDigest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: Immutable sha256 identity of the selected published Bundle; the server resolves its definition and upstream game versions from the catalog record.
        nodeId: {$ref: '#/components/schemas/Uuid'}
        memoryMb: {type: integer, minimum: 512, maximum: 131072}
        diskGb: {type: integer, minimum: 1, maximum: 2048}
    Allocation:
      type: object
      required: [id, serverId, nodeId, bindIp, port, protocol, containerPort, role, primary, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        serverId: {$ref: '#/components/schemas/Uuid'}
        nodeId: {$ref: '#/components/schemas/Uuid'}
        bindIp:
          type: string
          description: Canonical IPv4 or IPv6 bind address. Unspecified wildcard addresses (0.0.0.0 and ::) are rejected.
        port: {type: integer, minimum: 1, maximum: 65535}
        protocol: {type: string, enum: [tcp, udp]}
        portRef: {type: string, minLength: 1}
        containerPort: {type: integer, minimum: 1, maximum: 65535}
        role: {type: string, enum: [primary, query, rcon, additional]}
        primary:
          type: boolean
          description: Exactly one allocation per server is primary.
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateAllocationRequest:
      type: object
      additionalProperties: false
      required: [bindIp, port, protocol, primary]
      properties:
        bindIp: {type: string, minLength: 2, maxLength: 45}
        port: {type: integer, minimum: 1, maximum: 65535}
        protocol: {type: string, enum: [tcp, udp]}
        portRef: {type: string, minLength: 1}
        containerPort: {type: integer, minimum: 1, maximum: 65535}
        role: {type: string, enum: [primary, query, rcon, additional]}
        primary: {type: boolean}
    PromoteAllocationRequest:
      type: object
      additionalProperties: false
      required: [primary]
      properties:
        primary: {type: boolean, const: true}
    StartupCommand:
      type: object
      required: [executable, args]
      properties:
        executable: {type: string, minLength: 1}
        args:
          type: array
          items: {type: string}
    StartupScalar:
      description: A Startup value. Integer values use the JavaScript safe integer domain.
      oneOf:
        - type: string
        - type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        - type: boolean
    StartupVariable:
      type: object
      additionalProperties: false
      required: [key, type, secret, required, hasValue]
      description: Secret variables expose only declaration metadata and hasValue; value, default, constValue, and enumValues are omitted.
      properties:
        key: {type: string, minLength: 1}
        type:
          type: string
          enum: [string, integer, boolean]
          description: Integer variables use the JavaScript safe integer domain (-9007199254740991 through 9007199254740991).
        secret: {type: boolean}
        required: {type: boolean}
        default:
          allOf:
            - {$ref: '#/components/schemas/StartupScalar'}
          description: Declared default for a non-secret variable.
        value:
          allOf:
            - {$ref: '#/components/schemas/StartupScalar'}
          description: Configured non-secret value. This member is never returned for a secret variable.
        hasValue: {type: boolean}
        minimum: {type: integer, minimum: -9007199254740991, maximum: 9007199254740991}
        maximum: {type: integer, minimum: -9007199254740991, maximum: 9007199254740991}
        minLength: {type: integer, minimum: 0, maximum: 9007199254740991}
        maxLength: {type: integer, minimum: 0, maximum: 9007199254740991}
        enumValues:
          type: array
          uniqueItems: true
          items: {type: string}
          description: Declared candidates for a non-secret string variable.
        constValue:
          allOf:
            - {$ref: '#/components/schemas/StartupScalar'}
          description: Required constant value for a non-secret variable when declared by the game definition.
      allOf:
        - if:
            properties:
              secret: {const: true}
            required: [secret]
          then:
            not:
              anyOf:
                - required: [default]
                  properties:
                    default: {}
                - required: [value]
                  properties:
                    value: {}
                - required: [constValue]
                  properties:
                    constValue: {}
                - required: [enumValues]
                  properties:
                    enumValues: {}
    Startup:
      type: object
      required: [serverId, generation, command, variables]
      properties:
        serverId: {$ref: '#/components/schemas/Uuid'}
        generation: {type: integer, minimum: 1}
        command: {$ref: '#/components/schemas/StartupCommand'}
        variables:
          type: array
          items: {$ref: '#/components/schemas/StartupVariable'}
    UpdateStartupRequest:
      type: object
      additionalProperties: false
      required: [variables]
      properties:
        variables:
          type: object
          minProperties: 1
          additionalProperties:
            oneOf:
              - {$ref: '#/components/schemas/StartupScalar'}
              - type: 'null'
          description: Declared variable updates. Null clears an optional value, including a secret. Integer values are limited to the JavaScript safe integer domain.
    OperationError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code: {type: string, minLength: 1}
        message: {type: string, minLength: 1}
        retryable: {type: boolean}
    Operation:
      type: object
      required: [id, serverId, nodeId, type, status, progress, generation, attempt, maxAttempts, leaseOwner, leaseExpiresAt, checkpoint, error, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        serverId: {$ref: '#/components/schemas/Uuid'}
        nodeId: {$ref: '#/components/schemas/Uuid'}
        type: {type: string, enum: [provision, start, stop, restart, kill, backup, restore, backup-delete, delete, reconcile]}
        status: {type: string, enum: [queued, leased, running, succeeded, failed]}
        progress: {type: integer, minimum: 0, maximum: 100}
        generation: {type: integer, minimum: 1}
        attempt: {type: integer, minimum: 1}
        maxAttempts: {type: integer, minimum: 1}
        leaseOwner: {type: [string, 'null'], minLength: 1}
        leaseExpiresAt: {type: [string, 'null'], format: date-time}
        checkpoint: {type: string, minLength: 1}
        error:
          oneOf:
            - {$ref: '#/components/schemas/OperationError'}
            - type: 'null'
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    OperationResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Operation'}
    OperationListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Operation'}
        page:
          type: object
          required: [nextCursor]
          properties:
            nextCursor: {type: [string, 'null']}
    Node:
      type: object
      required: [id, name, condition, version, region, architecture, draining, address, lastHeartbeatAt, cpuCores, memoryBytes, diskBytes, allocatedMemoryBytes, allocatedDiskBytes, runningServers, totalServers, capabilities]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        condition: {type: string, enum: [available, offline, maintenance]}
        version: {type: string}
        region: {type: string}
        architecture: {type: string, description: Agent-reported runtime architecture such as amd64 or arm64.}
        draining: {type: boolean, description: True when automatic placement must exclude this node.}
        drainReason: {type: string, maxLength: 500}
        address: {type: string}
        lastHeartbeatAt: {type: string, format: date-time}
        cpuCores: {type: integer}
        memoryBytes: {type: integer}
        diskBytes: {type: integer}
        allocatedMemoryBytes: {type: integer}
        allocatedDiskBytes: {type: integer}
        runningServers: {type: integer, minimum: 0}
        totalServers: {type: integer, minimum: 0}
        capabilities:
          type: array
          items: {type: string}
    NodeResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Node'}
    DrainNodeRequest:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, maxLength: 500, default: ''}
    GameDefinition:
      type: object
      required: [id, bundleDigest, name, summary, version, gameVersion, status, capabilities, platforms, servers, icon, defaultMemoryMb, defaultDiskGb, signed, verified, runnable, supported, trustLevel, source, supportReasons, runtimeTarget]
      properties:
        id: {type: string}
        bundleDigest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
          description: Immutable sha256 identity of the published Bundle; it is not the upstream game release version or a component image digest.
        name: {type: string}
        summary: {type: string}
        version:
          type: string
          description: SemVer of this GameDefinition, not the upstream game release.
        gameVersion:
          type: string
          description: Opaque upstream game release identifier resolved from spec.release.version.
        status: {type: string, enum: [approved, pending, rejected]}
        capabilities:
          type: array
          items: {type: string}
        platforms:
          type: array
          items: {type: string}
        servers: {type: integer, minimum: 0}
        icon: {type: string}
        defaultMemoryMb: {type: integer, minimum: 512}
        defaultDiskGb: {type: integer, minimum: 1}
        signed:
          type: boolean
          description: True only when cryptographic signature material is present; a digest or signer label alone is not a signature.
        verified:
          type: boolean
          description: True only after the signature and authenticated publisher identity have been verified by the control plane.
        runnable:
          type: boolean
          description: True only when the current Agent contract can consume and execute an immutable runtime target for this exact Bundle.
        supported:
          type: boolean
          description: Overall support claim; requires an approved, verified, and runnable Bundle.
        trustLevel:
          type: string
          enum: [L0_LOCAL, L1_COMMUNITY, L2_GUGU_VERIFIED, L3_VENDOR]
        source:
          type: string
          description: Provenance of the catalog metadata, not proof of publisher identity.
        supportReasons:
          type: array
          items:
            type: string
            description: Stable machine-readable reason code explaining why the Bundle is not currently supported or runnable.
        runtimeTarget: {$ref: '#/components/schemas/GameRuntimeTarget'}
    GameRuntimeTarget:
      type: object
      additionalProperties: false
      required: [digest, adapter, image, user, workingDir, command, dataMounts, ports, stop, health]
      properties:
        digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        adapter: {type: string, enum: [container/v1]}
        image: {type: string, pattern: '^[^@]+@sha256:[a-f0-9]{64}$'}
        user: {type: string}
        workingDir: {type: string}
        command: {$ref: '#/components/schemas/StartupCommand'}
        environment:
          type: object
          additionalProperties: {type: string}
        dataMounts:
          type: array
          items: {$ref: '#/components/schemas/RuntimeDataMount'}
        ports:
          type: array
          items: {$ref: '#/components/schemas/RuntimePort'}
        stop: {$ref: '#/components/schemas/RuntimeStop'}
        health: {$ref: '#/components/schemas/RuntimeHealth'}
        console:
          oneOf:
            - {$ref: '#/components/schemas/RuntimeConsoleAdapter'}
            - type: 'null'
    RuntimeDataMount:
      type: object
      additionalProperties: false
      required: [name, target, backup]
      properties:
        name: {type: string}
        target: {type: string}
        backup: {type: boolean}
    RuntimePort:
      type: object
      additionalProperties: false
      required: [name, protocol, containerPort, role]
      properties:
        name: {type: string}
        protocol: {type: string, enum: [tcp, udp]}
        containerPort: {type: integer, minimum: 1, maximum: 65535}
        role: {type: string, enum: [primary, query, rcon, additional]}
    RuntimeStop:
      type: object
      additionalProperties: false
      required: [method, value, timeoutSeconds]
      properties:
        method: {type: string, enum: [signal, console]}
        value: {type: string}
        timeoutSeconds: {type: integer, minimum: 1, maximum: 300}
    RuntimeHealth:
      type: object
      additionalProperties: false
      required: [type, intervalSeconds, timeoutSeconds, failureThreshold]
      properties:
        type: {type: string, enum: [tcp, udp-query, process]}
        portRef: {type: string}
        intervalSeconds: {type: integer, minimum: 1}
        timeoutSeconds: {type: integer, minimum: 1}
        failureThreshold: {type: integer, minimum: 1}
    RuntimeConsoleAdapter:
      type: object
      additionalProperties: false
      required: [adapter, port]
      properties:
        adapter: {type: string, enum: [minecraft-rcon/v1]}
        port: {type: integer, minimum: 1, maximum: 65535}
    ConsoleLine:
      type: object
      required: [sequence, timestamp, stream, message]
      properties:
        sequence: {type: integer, minimum: 1}
        timestamp: {type: string, format: date-time}
        stream: {type: string, enum: [system, stdout, stderr, command]}
        message: {type: string}
    FileEntry:
      type: object
      required: [name, path, kind, sizeBytes, modifiedAt]
      properties:
        name: {type: string}
        path: {type: string}
        kind: {type: string, enum: [file, directory]}
        sizeBytes: {type: integer, minimum: 0}
        modifiedAt: {type: string, format: date-time}
    FileContent:
      type: object
      required: [path, content, encoding, sizeBytes, modifiedAt]
      properties:
        path: {type: string}
        content: {type: string}
        encoding: {type: string, enum: [utf-8, base64]}
        sizeBytes: {type: integer, minimum: 0, maximum: 8388608}
        modifiedAt: {type: string, format: date-time}
    Backup:
      type: object
      required: [id, name, status, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        status: {type: string, enum: [creating, ready, failed, restoring, deleting]}
        sizeBytes: {type: [integer, 'null'], minimum: 0}
        checksum: {type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$'}
        manifestDigest: {type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$'}
        storageLocation: {type: [string, 'null']}
        retentionUntil: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
        failureCode: {type: [string, 'null'], description: Stable machine-readable failure code for the latest failed transition.}
        failureMessage: {type: [string, 'null'], description: Safe operator-facing explanation for the latest failed transition.}
        deletedAt: {type: [string, 'null'], format: date-time, description: Soft-delete timestamp retained for recovery and garbage collection.}
    BackupPolicy:
      type: object
      additionalProperties: false
      required: [serverId, retentionDays, maxCount, protectManual, enabled, updatedAt]
      properties:
        serverId: {$ref: '#/components/schemas/Uuid'}
        retentionDays: {type: integer, minimum: 1, maximum: 3650}
        maxCount: {type: integer, minimum: 1, maximum: 1000}
        protectManual: {type: boolean}
        enabled: {type: boolean}
        updatedAt: {type: string, format: date-time}
    BackupPolicyRequest:
      type: object
      additionalProperties: false
      required: [retentionDays, maxCount, protectManual, enabled]
      properties:
        retentionDays: {type: integer, minimum: 1, maximum: 3650}
        maxCount: {type: integer, minimum: 1, maximum: 1000}
        protectManual: {type: boolean}
        enabled: {type: boolean}
    BackupPolicyResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/BackupPolicy'}
    ServerUpgradeRequest:
      type: object
      additionalProperties: false
      required: [bundleDigest]
      properties:
        bundleDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
    BundleSource:
      type: object
      additionalProperties: false
      required: [id, name, indexUrl, official, enabled, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string, minLength: 1, maxLength: 128}
        indexUrl: {type: string, format: uri, pattern: '^https://'}
        official: {type: boolean}
        enabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    BundleSourceRequest:
      type: object
      additionalProperties: false
      required: [name, indexUrl, official]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        indexUrl: {type: string, format: uri, pattern: '^https://'}
        official: {type: boolean}
        enabled: {type: boolean, default: true}
    BundleSourceResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/BundleSource'}
    BundleSourceListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/BundleSource'}
    BundleTrustRoot:
      type: object
      additionalProperties: false
      required: [id, keyId, name, source, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        keyId: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        name: {type: string, minLength: 1, maxLength: 128}
        source: {type: string, enum: [official, private, operator]}
        createdAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
    BundleTrustRootRequest:
      type: object
      additionalProperties: false
      required: [name, publicKeyPem]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        publicKeyPem: {type: string, minLength: 1, description: A single Ed25519 PKIX public key in PEM encoding.}
        source: {type: string, enum: [official, private, operator], default: private}
    BundleTrustRootResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/BundleTrustRoot'}
    BundleTrustRootListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/BundleTrustRoot'}
    BundleRevision:
      type: object
      additionalProperties: false
      required: [id, gameDefinitionId, definitionVersion, gameVersion, digest, schemaVersion, license, signatureKeyId, signatureVerified, reviewStatus, publishedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        gameDefinitionId: {type: string, minLength: 1}
        definitionVersion: {type: string, minLength: 1}
        gameVersion: {type: string, minLength: 1}
        digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        schemaVersion: {type: string, enum: [v1beta1]}
        license: {type: string, minLength: 1}
        signatureKeyId: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        signatureVerified: {type: boolean}
        reviewStatus: {type: string, enum: [pending, approved, rejected, revoked]}
        publishedAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
    BundleImportRequest:
      type: object
      additionalProperties: false
