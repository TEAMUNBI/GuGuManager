openapi: 3.1.0
info:
  title: GuGuManager Control Plane API
  version: 0.1.0
  description: Development vertical-slice contract. Production-only guarantees are marked in the design chapters.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
tags:
  - name: Setup
    description: One-time administrator bootstrap guarded by a deployment token.
  - name: Auth
    description: Session, CSRF-protected authentication, and one-time local password reset.
  - name: Users
    description: Platform-administrator user and server-membership management.
  - name: Overview
    description: Fleet-level development metrics and recent activity.
  - name: Servers
    description: Server lifecycle, power, console, files, backups, and operations.
  - name: Nodes
    description: Registered node snapshots and capacity.
  - name: Catalog
    description: Approved GameDefinition and Bundle catalog entries.
  - name: Automation
    description: Backup policies, cron schedules, and their immutable execution history.
  - name: Notifications
    description: In-app notifications and HMAC-signed HTTPS webhook endpoints.
  - name: Capacity
    description: Workspace quota, fleet capacity, and node drain controls.
  - name: Outbox
    description: Administrator inspection and replay of exhausted transactional events.
  - name: Audit
    description: Append-only development audit events.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      description: Returns 200 whenever the process is up. No authentication.
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: ok}
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      description: Returns 200 once the control plane is ready to accept traffic. No authentication.
      security: []
      responses:
        '200':
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                required: [status, adapter]
                properties:
                  status: {type: string, const: ready}
                  adapter: {type: string, description: "Storage adapter in use, e.g. development-memory."}
        '503':
          description: A required dependency, canonical migration, or encryption key is not ready
          content:
            application/json:
              schema:
                type: object
                required: [status, adapter]
                properties:
                  status: {type: string, const: not_ready}
                  adapter: {type: string, description: "Configured runtime adapter."}
  /setup/status:
    get:
      tags: [Setup]
      operationId: getSetupStatus
      summary: Read whether first-administrator setup is still required
      security: []
      responses:
        '200':
          description: Setup state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SetupStatusResponse'}
  /setup/admin:
    post:
      tags: [Setup]
      operationId: setupAdministrator
      summary: Atomically create the first platform administrator
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetupAdminRequest'}
      responses:
        '201':
          description: First administrator created and setup permanently closed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Establish a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '422': {$ref: '#/components/responses/Error'}
  /auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: Read the current session
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /auth/password-reset:
    post:
      tags: [Auth]
      operationId: resetLocalPassword
      summary: Consume a one-time password reset token and revoke old sessions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetRequest'}
      responses:
        '204': {description: Password replaced and all prior sessions revoked}
        '401': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api-tokens:
    get:
      tags: [Auth]
      operationId: listApiTokens
      summary: List the current user's active API tokens
      responses:
        '200':
          description: Token metadata; plaintext credentials are never listed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APITokenListResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Auth]
      operationId: createApiToken
      summary: Create a scoped API token and return its plaintext once
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAPITokenRequest'}
      responses:
        '201':
          description: One-time API token credential
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APITokenCredentialResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api-tokens/{tokenId}:
    parameters:
      - name: tokenId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Uuid'}
    delete:
      tags: [Auth]
      operationId: revokeApiToken
      summary: Revoke one of the current user's API tokens
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': {description: Token revoked}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List local users
      responses:
        '200':
          description: Local users
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserListResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a local user
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
      responses:
        '201':
          description: Local user created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getUser
      summary: Read a local user
      responses:
        '200':
          description: Local user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update display name, status, or global roles
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserRequest'}
      responses:
        '200':
          description: Updated local user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /users/{userId}/password-reset-tokens:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      operationId: issuePasswordResetToken
      summary: Issue a short-lived one-time local password reset token
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: One-time plaintext token; only its digest is retained
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasswordResetTokenResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /overview:
    get:
      tags: [Overview]
      operationId: getOverview
      summary: Read the fleet overview
      responses:
        '200':
          description: Fleet overview
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Overview'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /servers:
    get:
      tags: [Servers]
      operationId: listServers
      summary: List visible servers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: query
          in: query
          schema: {type: string, maxLength: 100}
      responses:
        '200':
          description: Servers visible to the current actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerListResponse'
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    post:
      tags: [Servers]
      operationId: createServer
      summary: Create a server
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '202':
          description: Provision operation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /servers/{serverId}:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      tags: [Servers]
      operationId: getServer
      summary: Read server details
      responses:
        '200':
          description: Server detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Server'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /servers/{serverId}/permissions:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      tags: [Servers]
      operationId: getEffectiveServerPermissions
      summary: Read the current actor's effective server permissions
      responses:
        '200':
          description: Effective permissions for the current actor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerPermissionsResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /servers/{serverId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ServerId'
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getServerMembership
      summary: Read a server membership
      responses:
        '200':
          description: Server membership
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerMembershipResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      tags: [Users]
      operationId: putServerMembership
      summary: Grant or replace server-scoped permissions
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutServerMembershipRequest'}
      responses:
        '200':
          description: Server membership granted or replaced
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerMembershipResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Users]
      operationId: deleteServerMembership
      summary: Revoke server access immediately
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': {description: Server membership revoked}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /servers/{serverId}/power:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    post:
      tags: [Servers]
      operationId: requestPower
      summary: Request a power transition
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action:
                  type: string
                  enum: [start, stop, restart, kill]
      responses:
        '202':
          description: Power operation accepted or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /servers/{serverId}/upgrade:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    post:
      tags: [Catalog]
      operationId: upgradeServerBundle
      summary: Reconcile a server to an approved immutable Bundle revision
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServerUpgradeRequest'}
      responses:
        '202':
          description: Bundle reconciliation accepted or idempotently reused
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /servers/{serverId}/rollback:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    post:
      tags: [Catalog]
      operationId: rollbackServerBundle
      summary: Reconcile a server to its last applied Bundle revision
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchGeneration'
      responses:
        '202':
          description: Bundle rollback accepted or idempotently reused
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /servers/{serverId}/allocations:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      tags: [Servers]
      operationId: listServerAllocations
      summary: List network allocations assigned to a server
      responses:
        '200':
          description: Server network allocations with exactly one primary allocation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    minItems: 1
                    items: {$ref: '#/components/schemas/Allocation'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [Servers]
      operationId: createServerAllocation
      summary: Assign a unique node endpoint and reconcile the server
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAllocationRequest'}
      responses:
        '202':
          description: Allocation reconciliation accepted or idempotently reused
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /servers/{serverId}/allocations/{allocationId}:
    parameters:
      - $ref: '#/components/parameters/ServerId'
      - $ref: '#/components/parameters/AllocationId'
    patch:
      tags: [Servers]
      operationId: promoteServerAllocation
      summary: Atomically promote an allocation to primary and reconcile the server
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromoteAllocationRequest'}
      responses:
        '202':
          description: Primary-allocation reconciliation accepted or idempotently reused
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Servers]
      operationId: deleteServerAllocation
      summary: Release a non-primary allocation and reconcile the server
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchGeneration'
      responses:
        '202':
          description: Allocation release reconciliation accepted or idempotently reused
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /servers/{serverId}/startup:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      tags: [Servers]
      operationId: getServerStartup
      summary: Read the resolved command and declared startup variables
      responses:
        '200':
          description: Startup configuration; secret variables expose only hasValue state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Startup'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    put:
      tags: [Servers]
      operationId: updateServerStartup
      summary: Validate startup variables and reconcile the server
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateStartupRequest'}
      responses:
        '202':
          description: Startup reconciliation accepted or idempotently reused
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /servers/{serverId}/console:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      tags: [Servers]
      operationId: getConsoleSnapshot
      summary: Read a console snapshot
      responses:
        '200':
          description: Development console snapshot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ConsoleLine'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /servers/{serverId}/console-tokens:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    post:
      tags: [Servers]
      operationId: issueConsoleConnectionToken
      summary: Issue a one-minute, single-use console WebSocket token
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: One-time console connection credential
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsoleConnectionCredentialResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /servers/{serverId}/console/commands:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    post:
      tags: [Servers]
